name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Project
      run: unzip -o project.zip
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      working-directory: ./project
      run: |
        chmod +x gradlew
        wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
        unzip -q gradle.zip
        ./gradle-8.9/bin/gradle assembleDebug --no-daemon -Dorg.gradle.java.home=/usr/lib/jvm/temurin-17-jdk-amd64
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project/app/build/outputs/apk/debug/app-debug.apk
