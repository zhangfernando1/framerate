name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Project
      run: unzip -o project.zip
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      working-directory: ./project
      run: |
        echo "当前系统使用的 Java 版本："
        java -version
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project/app/build/outputs/apk/debug/app-debug.apk
