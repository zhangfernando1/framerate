name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Project
      run: unzip -o project.zip
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Remove broken wrapper and build
      working-directory: ./project
      run: |
        rm -rf gradle gradlew gradlew.bat buildSrc
        wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle-8.9.zip
        unzip -q gradle-8.9.zip
        ./gradle-8.9/bin/gradle assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project/app/build/outputs/apk/debug/app-debug.apk
